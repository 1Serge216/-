<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✨ Тайный ангел · Танцуй, Кристина ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Poiret+One&family=Neucha&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #2d1b3a, #0b0715 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Neucha', 'Caveat', cursive, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* звёздный мерцающий фон */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 20px 4px #ffe9b0;
      animation: twinkle 3.5s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* основной контейнер */
    .card {
      position: relative;
      z-index: 10;
      max-width: 800px;
      width: 100%;
      background: rgba(20, 10, 35, 0.4);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 2px solid rgba(255, 200, 220, 0.55);
      border-radius: 100px 30px 100px 30px;
      padding: 45px 30px;
      box-shadow: 0 35px 60px rgba(0,0,0,0.8), 0 0 90px rgba(255, 140, 200, 0.5);
      text-align: center;
      color: #fff5f0;
      animation: floatCard 6s infinite ease-in-out;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 105px 35px 105px 35px;
      padding: 3px;
      background: linear-gradient(45deg, #f9a8d4, #f472b6, #c084fc, #f9a8d4);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderGlow 5s linear infinite;
      z-index: -1;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-family: 'Marck Script', cursive;
      font-size: 4.5rem;
      font-weight: 700;
      background: linear-gradient(180deg, #ffe6a6, #ffb7b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px #ff99cc);
      margin-bottom: 15px;
      letter-spacing: 3px;
      animation: titleGlow 2.5s infinite alternate;
    }

    @keyframes titleGlow {
      0% { text-shadow: 0 0 25px #ff80bf, 0 0 45px #d080ff; }
      100% { text-shadow: 0 0 50px #ffb3d9, 0 0 75px #c084fc; }
    }

    .subtitle {
      font-size: 2rem;
      color: #fdd5e6;
      background: rgba(50, 20, 60, 0.5);
      display: inline-block;
      padding: 8px 35px;
      border-radius: 50px;
      margin-bottom: 35px;
      letter-spacing: 2px;
      backdrop-filter: blur(5px);
      font-weight: 600;
      border: 1px dashed #ffb6d1;
    }

    /* КРОССВОРД "ТАНЦУЙ" */
    .crossword {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin: 25px 0 30px;
    }

    .word-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 25px 35px;
    }

    .letter-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .big-letter {
      font-family: 'Marck Script', 'Caveat', cursive;
      font-size: 5.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd966, #ff8c8c, #d08cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 25px #ff80bf);
      line-height: 1;
      animation: letterJump 2.8s infinite ease-in-out;
      cursor: default;
    }

    /* разная задержка для букв */
    .letter-block:nth-child(1) .big-letter { animation-delay: 0s; }
    .letter-block:nth-child(2) .big-letter { animation-delay: 0.2s; }
    .letter-block:nth-child(3) .big-letter { animation-delay: 0.4s; }
    .letter-block:nth-child(4) .big-letter { animation-delay: 0.6s; }
    .letter-block:nth-child(5) .big-letter { animation-delay: 0.8s; }
    .letter-block:nth-child(6) .big-letter { animation-delay: 1.0s; }

    @keyframes letterJump {
      0% { transform: translateY(0px) scale(1); }
      30% { transform: translateY(-18px) scale(1.1); }
      60% { transform: translateY(0px) scale(0.95); }
      100% { transform: translateY(0px) scale(1); }
    }

    .small-word {
      font-family: 'Neucha', 'Caveat', cursive;
      font-size: 2rem;
      font-weight: 600;
      color: #fde2c4;
      background: rgba(138, 43, 95, 0.5);
      padding: 6px 18px;
      border-radius: 35px;
      backdrop-filter: blur(4px);
      margin-top: 6px;
      box-shadow: 0 0 18px #ff99cc55;
      letter-spacing: 1.5px;
      border: 1px solid #ffb6d1;
      animation: wordPulse 2.2s infinite alternate;
    }

    @keyframes wordPulse {
      0% { background: rgba(138, 43, 95, 0.4); }
      100% { background: rgba(170, 70, 120, 0.6); }
    }

    .angel-message {
      font-size: 2.2rem;
      margin: 20px 0 10px;
      color: #ffdab9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255,255,245,0.08);
      border-radius: 40px;
      padding: 12px 25px;
    }

    .footer-note {
      margin-top: 25px;
      font-size: 2.1rem;
      color: #eac4ff;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* падающие снежинки/блёстки */
    .snowflake {
      position: fixed;
      top: -50px;
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 20px #ff99cc, 0 0 35px #b57bee;
      animation: fall linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 550px) {
      .big-letter {
        font-size: 3.8rem;
      }
      .small-word {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>
  <div id="snowflakesContainer"></div>

  <div class="card">
    <h1>Кристина</h1>
    <div class="subtitle">🪽 Тайный ангел 🪽</div>

    <!-- Кроссворд: Т А Н Ц У Й -->
    <div class="crossword">
      <div class="word-row">
        <!-- Т -> Тепло -->
        <div class="letter-block">
          <span class="big-letter">Т</span>
          <span class="small-word">Тепло</span>
        </div>
        <!-- А -> Ангел -->
        <div class="letter-block">
          <span class="big-letter">А</span>
          <span class="small-word">Ангел</span>
        </div>
        <!-- Н -> Нежность -->
        <div class="letter-block">
          <span class="big-letter">Н</span>
          <span class="small-word">Нежность</span>
        </div>
      </div>
      <div class="word-row">
        <!-- Ц -> Цветы -->
        <div class="letter-block">
          <span class="big-letter">Ц</span>
          <span class="small-word">Цветы</span>
        </div>
        <!-- У -> Улыбка -->
        <div class="letter-block">
          <span class="big-letter">У</span>
          <span class="small-word">Улыбка</span>
        </div>
        <!-- Й -> Йогурт? нет, лучше Йети (добрый) или Йота (капля счастья). Сделаем Йота радости -->
        <div class="letter-block">
          <span class="big-letter">Й</span>
          <span class="small-word">Йота✨</span>
        </div>
      </div>
    </div>

    <div class="angel-message">
      <span>🎀</span> Танцуй, мечтай, сияй! <span>🎀</span>
    </div>

    <div class="footer-note">
      <span>❄️ Твой тайный ангел</span>
      <span>🌟</span>
    </div>
  </div>

  <script>
    (function() {
      // звёзды
      const starsContainer = document.getElementById('starsContainer');
      for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 6 + 2;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 5 + 's';
        star.style.animationDuration = 2.2 + Math.random() * 5 + 's';
        const colors = ['#fffde7', '#ffe0f0', '#f8d5ff', '#ffccf9', '#d4c5f9'];
        star.style.background = colors[Math.floor(Math.random() * colors.length)];
        star.style.boxShadow = `0 0 ${Math.random()*22+6}px ${colors[Math.floor(Math.random()*colors.length)]}`;
        starsContainer.appendChild(star);
      }

      // падающие элементы
      const snowflakesContainer = document.getElementById('snowflakesContainer');
      const emojis = ['❄️', '🪽', '✨', '💖', '🌟', '🎀', '🕊️', '💫', '🧚', '🌸', '⭐', '🔮'];

      function createSnowflake() {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        flake.style.left = Math.random() * 100 + '%';
        flake.style.fontSize = (Math.random() * 28 + 18) + 'px';
        flake.style.animationDuration = Math.random() * 7 + 7 + 's';
        flake.style.opacity = Math.random() * 0.9 + 0.3;
        snowflakesContainer.appendChild(flake);
        setTimeout(() => {
          if (flake && flake.parentNode) flake.remove();
        }, 15000);
      }

      setInterval(createSnowflake, 380);
      for (let i = 0; i < 14; i++) {
        setTimeout(createSnowflake, i * 180);
      }

      // лёгкий параллакс
      document.addEventListener('mousemove', (e) => {
        const card = document.querySelector('.card');
        if (!card) return;
        const x = (window.innerWidth/2 - e.clientX) / 50;
        const y = (window.innerHeight/2 - e.clientY) / 50;
        card.style.transform = `translateY(-6px) rotateY(${x}deg) rotateX(${y}deg)`;
      });
      document.addEventListener('mouseleave', () => {
        const card = document.querySelector('.card');
        if (card) card.style.transform = 'translateY(0px) rotateY(0deg) rotateX(0deg)';
      });
    })();
  </script>
</body>
</html>
