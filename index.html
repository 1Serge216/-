<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✨ Тайный ангел · Танцуй, Кристина ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Neucha&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 25% 30%, #1e1a2f, #0b0815 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Neucha', 'Caveat', cursive, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* звёзды */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 18px 3px #c8b8ff;
      animation: twinkle 3.2s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.25; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 750px;
      width: 100%;
      background: rgba(18, 14, 32, 0.55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 2px solid rgba(180, 160, 255, 0.5);
      border-radius: 90px 25px 90px 25px;
      padding: 40px 25px;
      box-shadow: 0 30px 55px rgba(0,0,0,0.8), 0 0 80px rgba(140, 120, 255, 0.45);
      text-align: center;
      color: #eae2ff;
      animation: floatCard 5.5s infinite ease-in-out;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 95px 30px 95px 30px;
      padding: 3px;
      background: linear-gradient(45deg, #b794f4, #63b3ed, #b794f4);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderGlow 5s linear infinite;
      z-index: -1;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-family: 'Marck Script', cursive;
      font-size: 4.2rem;
      font-weight: 700;
      background: linear-gradient(180deg, #d4c5f9, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px #818cf8);
      margin-bottom: 8px;
      letter-spacing: 3px;
      animation: titleGlow 2.8s infinite alternate;
    }

    @keyframes titleGlow {
      0% { text-shadow: 0 0 22px #7f9cf5, 0 0 40px #a78bfa; }
      100% { text-shadow: 0 0 45px #93c5fd, 0 0 70px #c4b5fd; }
    }

    .subtitle {
      font-size: 1.9rem;
      color: #cdd6f4;
      background: rgba(45, 35, 70, 0.55);
      display: inline-block;
      padding: 8px 38px;
      border-radius: 50px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      backdrop-filter: blur(6px);
      font-weight: 600;
      border: 1px dashed #a5b4fc;
    }

    /* кроссворд */
    .crossword {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin: 20px 0 25px;
    }

    .word-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 30px 40px;
    }

    .letter-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 800px;
    }

    /* кнопка-буква с 3D переворотом */
    .flip-btn {
      background: none;
      border: none;
      cursor: pointer;
      width: 100px;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .flip-btn.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      font-family: 'Marck Script', 'Caveat', cursive;
      font-weight: 700;
    }

    .front {
      background: linear-gradient(145deg, #2d234a, #1a1530);
      border: 2px solid #8b9cf7;
      box-shadow: 0 0 28px #6d6ef555;
      color: #e0d7ff;
      font-size: 5.5rem;
      text-shadow: 0 0 18px #b1a8ff;
    }

    .back {
      background: linear-gradient(145deg, #312e5c, #1e1a38);
      border: 2px solid #b7a6ff;
      box-shadow: 0 0 32px #a78bfa;
      color: #f5e9ff;
      font-size: 2.3rem;
      font-family: 'Neucha', 'Caveat', cursive;
      transform: rotateY(180deg);
      padding: 8px;
      text-align: center;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .small-word-static {
      font-family: 'Neucha', 'Caveat', cursive;
      font-size: 1.9rem;
      font-weight: 600;
      color: #cfc4f0;
      background: rgba(70, 55, 110, 0.55);
      padding: 6px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      margin-top: 8px;
      box-shadow: 0 0 20px #7f8bf755;
      letter-spacing: 1.5px;
      border: 1px solid #a78bfa;
    }

    .angel-message {
      font-size: 2.1rem;
      margin: 25px 0 10px;
      color: #ddd0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255,255,250,0.06);
      border-radius: 45px;
      padding: 12px 30px;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 2rem;
      color: #b9adff;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .reset-hint {
      margin-top: 18px;
      font-size: 1.5rem;
      color: #9c94d0;
      opacity: 0.8;
    }

    /* падающие элементы */
    .snowflake {
      position: fixed;
      top: -50px;
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 18px #b49cff, 0 0 30px #6d8ae7;
      animation: fall linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 550px) {
      .flip-btn {
        width: 75px;
        height: 85px;
      }
      .front {
        font-size: 4rem;
      }
      .back {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>
  <div id="snowflakesContainer"></div>

  <div class="card">
    <h1>Кристина</h1>
    <div class="subtitle">🪽 Тайный ангел 🪽</div>

    <!-- кроссворд ТАНЦУЙ с кнопками -->
    <div class="crossword">
      <div class="word-row">
        <!-- Т -> Тепло -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Тепло">
            <span class="front">Т</span>
            <span class="back">🔥<br>Тепло</span>
          </button>
          <span class="small-word-static">Тепло</span>
        </div>
        <!-- А -> Ангел -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Ангел">
            <span class="front">А</span>
            <span class="back">🪽<br>Ангел</span>
          </button>
          <span class="small-word-static">Ангел</span>
        </div>
        <!-- Н -> Нежность -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Нежность">
            <span class="front">Н</span>
            <span class="back">🌸<br>Нежность</span>
          </button>
          <span class="small-word-static">Нежность</span>
        </div>
      </div>
      <div class="word-row">
        <!-- Ц -> Цветы -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Цветы">
            <span class="front">Ц</span>
            <span class="back">💐<br>Цветы</span>
          </button>
          <span class="small-word-static">Цветы</span>
        </div>
        <!-- У -> Улыбка -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Улыбка">
            <span class="front">У</span>
            <span class="back">😊<br>Улыбка</span>
          </button>
          <span class="small-word-static">Улыбка</span>
        </div>
        <!-- Й -> Йота радости -->
        <div class="letter-block">
          <button class="flip-btn" data-word="Йота✨">
            <span class="front">Й</span>
            <span class="back">✨<br>Йота</span>
          </button>
          <span class="small-word-static">Йота✨</span>
        </div>
      </div>
    </div>

    <div class="angel-message">
      <span>🌙</span> Танцуй, мечтай, сияй! <span>🌙</span>
    </div>

    <div class="footer-note">
      <span>❄️ Твой тайный ангел</span>
      <span>🌟</span>
    </div>
    <div class="reset-hint">(нажми на буквы — они перевернутся)</div>
  </div>

  <script>
    (function() {
      // звёзды
      const starsContainer = document.getElementById('starsContainer');
      for (let i = 0; i < 110; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 5 + 2;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.animationDuration = 2 + Math.random() * 5 + 's';
        const colors = ['#e9e2ff', '#d4ccff', '#c7d2fe', '#b9c8ff', '#ddd6fe'];
        star.style.background = colors[Math.floor(Math.random() * colors.length)];
        star.style.boxShadow = `0 0 ${Math.random()*20+5}px ${colors[Math.floor(Math.random()*colors.length)]}`;
        starsContainer.appendChild(star);
      }

      // падающие элементы
      const snowflakesContainer = document.getElementById('snowflakesContainer');
      const emojis = ['❄️', '✨', '🌙', '💫', '🕊️', '⭐', '🔮', '🧩', '☁️', '💠', '🪄', '🌠'];

      function createSnowflake() {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        flake.style.left = Math.random() * 100 + '%';
        flake.style.fontSize = (Math.random() * 26 + 16) + 'px';
        flake.style.animationDuration = Math.random() * 7 + 7 + 's';
        flake.style.opacity = Math.random() * 0.85 + 0.3;
        snowflakesContainer.appendChild(flake);
        setTimeout(() => {
          if (flake && flake.parentNode) flake.remove();
        }, 14000);
      }

      setInterval(createSnowflake, 420);
      for (let i = 0; i < 12; i++) {
        setTimeout(createSnowflake, i * 170);
      }

      // ---- логика переворота кнопок ----
      const flipButtons = document.querySelectorAll('.flip-btn');
      flipButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          // переключаем класс flipped
          this.classList.toggle('flipped');
          
          // небольшой дополнительный эффект: меняем тень на время
          if (this.classList.contains('flipped')) {
            this.style.filter = 'drop-shadow(0 0 20px #b794f4)';
          } else {
            this.style.filter = 'none';
          }
        });
      });

      // лёгкий параллакс карточки
      document.addEventListener('mousemove', (e) => {
        const card = document.querySelector('.card');
        if (!card) return;
        const x = (window.innerWidth/2 - e.clientX) / 45;
        const y = (window.innerHeight/2 - e.clientY) / 45;
        card.style.transform = `translateY(-6px) rotateY(${x}deg) rotateX(${y}deg)`;
      });
      document.addEventListener('mouseleave', () => {
        const card = document.querySelector('.card');
        if (card) card.style.transform = 'translateY(0px) rotateY(0deg) rotateX(0deg)';
      });
    })();
  </script>
</body>
</html>
