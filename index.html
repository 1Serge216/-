<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✨ Тайный ангел · Танцуй, Кристина ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Neucha&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 25%, #3d2a4a, #1a1025 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Neucha', 'Caveat', cursive, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* яркие звёзды */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 22px 4px #ffd966, 0 0 35px #f9a8d4;
      animation: twinkle 2.8s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.5); }
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 780px;
      width: 100%;
      background: rgba(30, 18, 45, 0.5);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      border: 2px solid rgba(255, 190, 130, 0.6);
      border-radius: 100px 30px 100px 30px;
      padding: 40px 25px 35px;
      box-shadow: 0 30px 55px rgba(0,0,0,0.7), 0 0 90px rgba(255, 170, 100, 0.5), 0 0 140px rgba(255, 140, 200, 0.35);
      text-align: center;
      color: #fff5e6;
      animation: floatCard 5.5s infinite ease-in-out;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 105px 35px 105px 35px;
      padding: 3px;
      background: linear-gradient(45deg, #fbbf24, #f472b6, #f9a8d4, #fbbf24);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderGlow 4.5s linear infinite;
      z-index: -1;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-family: 'Marck Script', cursive;
      font-size: 4.5rem;
      font-weight: 700;
      background: linear-gradient(180deg, #ffe09c, #ffb7a7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px #ffb56b);
      margin-bottom: 8px;
      letter-spacing: 3px;
      animation: titleGlow 2.5s infinite alternate;
    }

    @keyframes titleGlow {
      0% { text-shadow: 0 0 25px #fbbf24, 0 0 45px #f9a8d4; }
      100% { text-shadow: 0 0 50px #fcd34d, 0 0 75px #fda4af; }
    }

    .subtitle {
      font-size: 2rem;
      color: #ffe4c9;
      background: rgba(90, 50, 90, 0.45);
      display: inline-block;
      padding: 8px 38px;
      border-radius: 50px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      backdrop-filter: blur(6px);
      font-weight: 600;
      border: 1px dashed #fcd34d;
    }

    /* кроссворд */
    .crossword {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin: 20px 0 25px;
    }

    .word-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 30px 40px;
    }

    .letter-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 900px;
    }

    /* кнопка-буква с 3D переворотом */
    .flip-btn {
      background: none;
      border: none;
      cursor: pointer;
      width: 105px;
      height: 115px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      outline: none;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 0 18px #fbbf2480);
    }

    .flip-btn.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      font-family: 'Marck Script', 'Caveat', cursive;
      font-weight: 700;
    }

    .front {
      background: linear-gradient(145deg, #fde68a, #fcd34d);
      border: 3px solid #fbbf24;
      box-shadow: 0 0 35px #fbbf24aa, inset 0 0 12px #fff3c0;
      color: #4a2c2c;
      font-size: 5.8rem;
      text-shadow: 2px 2px 0 #fff3cd;
    }

    .back {
      background: linear-gradient(145deg, #fcd3e1, #f9a8d4);
      border: 3px solid #f472b6;
      box-shadow: 0 0 38px #f9a8d4cc, inset 0 0 12px #ffe4f0;
      color: #4a1942;
      font-size: 2.2rem;
      font-family: 'Neucha', 'Caveat', cursive;
      transform: rotateY(180deg);
      padding: 10px;
      text-align: center;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-weight: 700;
    }

    /* скрытое слово снизу – появляется при клике */
    .hidden-word {
      font-family: 'Neucha', 'Caveat', cursive;
      font-size: 1.9rem;
      font-weight: 700;
      color: #fde68a;
      background: rgba(160, 70, 120, 0.6);
      padding: 6px 22px;
      border-radius: 30px;
      backdrop-filter: blur(6px);
      margin-top: 8px;
      box-shadow: 0 0 25px #fbbf2490;
      letter-spacing: 1.5px;
      border: 1px solid #fcd34d;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .letter-block.revealed .hidden-word {
      opacity: 1;
      transform: translateY(0);
      background: rgba(200, 100, 140, 0.7);
      box-shadow: 0 0 30px #f9a8d4;
    }

    .angel-message {
      font-size: 2.2rem;
      margin: 28px 0 10px;
      color: #ffe7c4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgba(255,255,240,0.08);
      border-radius: 45px;
      padding: 12px 30px;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 2rem;
      color: #fcd6b0;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .reset-hint {
      margin-top: 16px;
      font-size: 1.5rem;
      color: #e7b8ff;
      opacity: 0.85;
    }

    /* частицы (конфетти) */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 2rem;
      animation: particleBurst 0.9s ease-out forwards;
    }

    @keyframes particleBurst {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0.2);
        opacity: 0;
      }
    }

    /* падающие снежинки */
    .snowflake {
      position: fixed;
      top: -50px;
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 18px #ffb86c, 0 0 32px #f472b6;
      animation: fall linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    .emoji-jump {
      display: inline-block;
      animation: bounceEmoji 1.2s infinite;
    }

    @keyframes bounceEmoji {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @media (max-width: 550px) {
      .flip-btn {
        width: 80px;
        height: 90px;
      }
      .front {
        font-size: 4.2rem;
      }
      .back {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>
  <div id="snowflakesContainer"></div>

  <div class="card">
    <h1>Кристина</h1>
    <div class="subtitle">
      <span class="emoji-jump">🪽</span> Тайный ангел <span class="emoji-jump">🪽</span>
    </div>

    <!-- кроссворд ТАНЦУЙ (без нежности и йоты) -->
    <div class="crossword">
      <div class="word-row">
        <!-- Т -> Тепло -->
        <div class="letter-block" id="blockT">
          <button class="flip-btn" data-word="Тепло" data-target="blockT">
            <span class="front">Т</span>
            <span class="back">🔥<br>Тепло</span>
          </button>
          <span class="hidden-word">Тепло</span>
        </div>
        <!-- А -> Ангел -->
        <div class="letter-block" id="blockA">
          <button class="flip-btn" data-word="Ангел" data-target="blockA">
            <span class="front">А</span>
            <span class="back">🪽<br>Ангел</span>
          </button>
          <span class="hidden-word">Ангел</span>
        </div>
        <!-- Н -> Небо (вместо нежности) -->
        <div class="letter-block" id="blockN">
          <button class="flip-btn" data-word="Небо" data-target="blockN">
            <span class="front">Н</span>
            <span class="back">☁️<br>Небо</span>
          </button>
          <span class="hidden-word">Небо</span>
        </div>
      </div>
      <div class="word-row">
        <!-- Ц -> Цветы -->
        <div class="letter-block" id="blockC">
          <button class="flip-btn" data-word="Цветы" data-target="blockC">
            <span class="front">Ц</span>
            <span class="back">💐<br>Цветы</span>
          </button>
          <span class="hidden-word">Цветы</span>
        </div>
        <!-- У -> Улыбка -->
        <div class="letter-block" id="blockU">
          <button class="flip-btn" data-word="Улыбка" data-target="blockU">
            <span class="front">У</span>
            <span class="back">😊<br>Улыбка</span>
          </button>
          <span class="hidden-word">Улыбка</span>
        </div>
        <!-- Й -> Йогурт (вместо йоты) -->
        <div class="letter-block" id="blockJ">
          <button class="flip-btn" data-word="Йогурт" data-target="blockJ">
            <span class="front">Й</span>
            <span class="back">🍦<br>Йогурт</span>
          </button>
          <span class="hidden-word">Йогурт</span>
        </div>
      </div>
    </div>

    <div class="angel-message">
      <span class="emoji-jump">🌟</span> Танцуй, мечтай, сияй! <span class="emoji-jump">🌟</span>
    </div>

    <div class="footer-note">
      <span>❄️ Твой тайный ангел</span>
      <span>🎁</span>
    </div>
    <div class="reset-hint">✨ нажми на буквы — увидишь слово ✨</div>
  </div>

  <script>
    (function() {
      // яркие звёзды
      const starsContainer = document.getElementById('starsContainer');
      for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 6 + 2;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.animationDuration = 2.2 + Math.random() * 5 + 's';
        const colors = ['#fde68a', '#fcd34d', '#f9a8d4', '#fda4af', '#fbbf24', '#fbcfe8'];
        star.style.background = colors[Math.floor(Math.random() * colors.length)];
        star.style.boxShadow = `0 0 ${Math.random()*22+6}px ${colors[Math.floor(Math.random()*colors.length)]}`;
        starsContainer.appendChild(star);
      }

      // падающие снежинки
      const snowflakesContainer = document.getElementById('snowflakesContainer');
      const emojis = ['❄️', '✨', '🌟', '💫', '🕊️', '🎀', '🔮', '💖', '🌸', '🪄', '💠', '🌙', '☀️', '🧚'];

      function createSnowflake() {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        flake.style.left = Math.random() * 100 + '%';
        flake.style.fontSize = (Math.random() * 28 + 18) + 'px';
        flake.style.animationDuration = Math.random() * 7 + 7 + 's';
        flake.style.opacity = Math.random() * 0.9 + 0.3;
        snowflakesContainer.appendChild(flake);
        setTimeout(() => {
          if (flake && flake.parentNode) flake.remove();
        }, 15000);
      }
      setInterval(createSnowflake, 400);
      for (let i = 0; i < 15; i++) {
        setTimeout(createSnowflake, i * 160);
      }

      // конфетти-частицы при клике
      function spawnParticles(x, y) {
        const particleEmojis = ['✨', '🌟', '💛', '💖', '🎉', '🎊', '🪩', '⭐', '💝', '🔆'];
        for (let i = 0; i < 14; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.innerHTML = particleEmojis[Math.floor(Math.random() * particleEmojis.length)];
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          const angle = Math.random() * 2 * Math.PI;
          const distance = 50 + Math.random() * 80;
          particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
          particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
          document.body.appendChild(particle);
          setTimeout(() => {
            if (particle && particle.parentNode) particle.remove();
          }, 950);
        }
      }

      // логика переворота + показ слова
      const flipButtons = document.querySelectorAll('.flip-btn');
      flipButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const targetId = this.dataset.target;
          const block = document.getElementById(targetId);
          
          // переключаем переворот
          this.classList.toggle('flipped');
          
          // показываем/прячем слово под буквой
          if (block) {
            if (this.classList.contains('flipped')) {
              block.classList.add('revealed');
            } else {
              block.classList.remove('revealed');
            }
          }

          // конфетти в месте клика
          spawnParticles(e.clientX, e.clientY);
          
          // свечение при перевороте
          if (this.classList.contains('flipped')) {
            this.style.filter = 'drop-shadow(0 0 28px #f472b6)';
          } else {
            this.style.filter = 'drop-shadow(0 0 18px #fbbf2480)';
          }
        });
      });

      // параллакс
      document.addEventListener('mousemove', (e) => {
        const card = document.querySelector('.card');
        if (!card) return;
        const x = (window.innerWidth/2 - e.clientX) / 45;
        const y = (window.innerHeight/2 - e.clientY) / 45;
        card.style.transform = `translateY(-6px) rotateY(${x}deg) rotateX(${y}deg)`;
      });
      document.addEventListener('mouseleave', () => {
        const card = document.querySelector('.card');
        if (card) card.style.transform = 'translateY(0px) rotateY(0deg) rotateX(0deg)';
      });
    })();
  </script>
</body>
</html>
